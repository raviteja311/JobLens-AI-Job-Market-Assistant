name: eval

# The gate. An eval that only prints numbers is a report; this one fails the
# build, which is the difference between measuring quality and having it.
#
# The database here is new on every run, so there is never a previous run to
# compare with. The regression check falls back to data/eval_baseline.json,
# committed scores for every retrieval configuration, and a drop of more than
# 0.05 against it fails the job. The baseline was measured on the dev corpus
# and this job scores a fresh ingest, so a big gap can be corpus drift rather
# than a code change; the job summary shows which metric moved.
#
# Retrieval only. The chat suite needs a model, and a local Llama on a GitHub
# runner takes half an hour, so /chat is scored on a schedule and before a
# release rather than on every push. Pretending otherwise would give a green
# tick that means nothing.
on:
  pull_request:
    paths:
      - "src/joblens/search/**"
      - "src/joblens/eval/**"
      - "prompts/**"
      - "data/golden/**"
      - "data/eval_baseline.json"
  workflow_dispatch:
  workflow_call:

jobs:
  retrieval:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: joblens
          POSTGRES_PASSWORD: joblens
          POSTGRES_DB: joblens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://joblens:joblens@localhost:5432/joblens

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: collect a corpus to score against
        run: |
          python -m joblens migrate
          python -m joblens ingest --limit 400

      - name: build the index
        run: python -m joblens embed --strategy whole --strategy section

      # --strict makes a score drop exit 1. Without it this job is decoration.
      # So is a pipe without pipefail: a step with no `shell:` runs under
      # `bash -e`, the step's exit code is tee's, and until 2026-10-09 this
      # gate passed even when the eval crashed. `shell: bash` adds pipefail.
      - name: score retrieval
        shell: bash
        run: python -m joblens eval --suite retrieval --strict | tee eval.md

      - name: publish the scorecard
        if: always()
        run: cat eval.md >> "$GITHUB_STEP_SUMMARY"
