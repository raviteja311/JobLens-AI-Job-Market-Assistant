name: ingest

# Daily collection. GitHub's scheduler is best-effort and can run late or skip
# a slot under load, which is fine: the pipeline is idempotent, so a missed day
# costs us that day's postings and nothing else.
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:
    inputs:
      limit:
        description: postings per source
        default: "200"

permissions:
  contents: read
  issues: write

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
      ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
      ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
      USER_AGENT: ${{ vars.USER_AGENT }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      # No database, no run. Until a hosted Postgres exists and its URL is in
      # the DATABASE_URL secret there is nothing to ingest into, and a daily
      # red run for a known cause would drown the alert below in noise.
      - name: check configuration
        id: config
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "configured=false" >> "$GITHUB_OUTPUT"
            echo "::notice::DATABASE_URL secret is not set; skipping ingestion. See docs/runbook.md."
            echo "Skipped: DATABASE_URL secret is not set." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.config.outputs.configured == 'true'
        run: pip install -e .

      - if: steps.config.outputs.configured == 'true'
        run: python -m joblens migrate

      - if: steps.config.outputs.configured == 'true'
        run: python -m joblens ingest --limit ${{ inputs.limit || 200 }}

      - name: summary
        if: always() && steps.config.outputs.configured == 'true'
        run: python -m joblens stats >> "$GITHUB_STEP_SUMMARY"

      # The alert. A scheduled workflow that fails sends an email to whoever
      # last touched it and nothing else, which is easy to miss for a week.
      # An open issue is visible on the repo page and in the runbook, and
      # repeat failures thread onto it instead of opening one a day.
      - name: alert on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          gh label create ingest-failure --color B60205 --force \
            --description "the daily ingestion run failed" >/dev/null
          existing=$(gh issue list --label ingest-failure --state open \
            --json number --jq '.[0].number')
          body="Ingestion run failed: $RUN_URL

          Runbook: docs/runbook.md, section \"Ingestion failed\"."
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body "$body"
          else
            gh issue create --label ingest-failure \
              --title "Ingestion failed on $(date -u +%F)" --body "$body"
          fi
