name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # The db-marked tests skip themselves when nothing is listening. Running a
    # real Postgres here means they actually execute on every PR, which is the
    # only way the upsert and run-log behaviour stays covered.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: joblens
          POSTGRES_PASSWORD: joblens
          POSTGRES_DB: joblens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://joblens:joblens@localhost:5432/joblens

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: lint
        run: |
          ruff check src tests
          black --check src tests

      - name: test
        run: pytest -q
