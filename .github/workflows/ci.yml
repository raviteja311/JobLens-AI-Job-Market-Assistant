name: ci

# Pull requests run this directly. Pushes to main run it as the first
# stage of deploy.yml, so it is callable and does not also fire on push,
# which would run every test twice per merge.
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest

    # The db-marked tests skip themselves when nothing is listening. Running a
    # real Postgres here means they actually execute on every PR, which is the
    # only way the upsert and run-log behaviour stays covered.
    services:
      postgres:
        # pgvector, not plain postgres: the search migrations create the
        # vector extension, and on postgres:16 every db test fails with
        # 'extension "vector" is not available'. It did, for three phases.
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: joblens
          POSTGRES_PASSWORD: joblens
          POSTGRES_DB: joblens
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://joblens:joblens@localhost:5432/joblens

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -e ".[dev]"

      - name: lint
        run: |
          ruff check src tests
          black --check src tests

      - name: test
        run: pytest -q
