name: preview-image

# Publishes both images from any branch, tagged preview-<short sha>, for a
# deployment to try before the branch reaches main. deploy.yml stays the only
# route to `latest`, behind the tests and the retrieval eval gate; a preview
# tag passes the tests only, and says so in its name.
#
# Run it from the Actions tab ("Run workflow", pick the branch) or with
#   gh workflow run preview-image --ref <branch>
on:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    uses: ./.github/workflows/ci.yml

  images:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: tag
        shell: bash
        run: echo "tag=preview-$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # The API image also runs the daily ingest job, so it carries the
      # board company list (see Dockerfile and .dockerignore).
      - name: api image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: runtime
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/joblens:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=runtime
          cache-to: type=gha,scope=runtime,mode=max

      - name: dashboard image
        uses: docker/build-push-action@v7
        with:
          context: .
          target: ui
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/joblens-ui:${{ steps.tag.outputs.tag }}
          cache-from: type=gha,scope=ui
          cache-to: type=gha,scope=ui,mode=max

      - name: image summary
        shell: bash
        run: |
          {
            echo "### preview images"
            echo
            echo '```'
            echo "ghcr.io/${{ github.repository_owner }}/joblens:${{ steps.tag.outputs.tag }}"
            echo "ghcr.io/${{ github.repository_owner }}/joblens-ui:${{ steps.tag.outputs.tag }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
