# Golden QA pairs for /chat.
#
# Deliberately small. Every question is one local LLM call to answer plus one
# to judge, and on CPU that is around two minutes a question, so a suite of
# sixty would never be run and an eval nobody runs is not an eval.
#
# expected_facts are checked by the judge for completeness, not by string
# match. must_refuse marks the questions the corpus genuinely cannot answer:
# the correct behaviour is to say so, and a fluent answer to one of these is
# the single worst failure this system can have.
#
# Rewritten 2026-10-27 for the Indian corpus (625 postings). Every answerable
# question was checked against postings that answer it, and every
# must_refuse one asks for something no posting states (checked by query);
# see docs/experiments.md.
version: 2
questions:
- id: c01
  question: which companies are hiring data engineers in Hyderabad?
  expected_facts:
  - names at least one company with a data engineer posting located in Hyderabad
  - does not claim to be a complete list of the market
  must_refuse: false
- id: c02
  question: are there any internships in AI, ML or data?
  expected_facts:
  - names at least one intern posting
  - does not claim there are none
  must_refuse: false
- id: c03
  question: which roles ask for Databricks experience?
  expected_facts:
  - names at least one role whose cited posting mentions Databricks
  - does not list a posting that never mentions it
  must_refuse: false
- id: c04
  question: which roles involve building RAG systems or LLM agents with LangChain or LangGraph?
  expected_facts:
  - names at least one posting that mentions LangChain or LangGraph
  - the technologies named appear in the cited postings
  must_refuse: false
- id: c05
  question: are there remote machine learning engineer roles open to people in India?
  expected_facts:
  - names at least one remote machine learning posting
  - states where or how it is remote only as the posting says
  must_refuse: false
- id: c06
  question: which companies are hiring MLOps engineers?
  expected_facts:
  - names at least one company with an MLOps posting
  - does not claim to be a complete list of the market
  must_refuse: false
- id: c07
  question: which data analyst roles ask for Power BI or Tableau?
  expected_facts:
  - names at least one analyst role whose cited posting mentions Power BI or Tableau
  - says which of the two tools the posting names
  must_refuse: false
- id: c08
  question: what salary do the data engineer roles offer?
  expected_facts:
  - quotes a salary only if a cited posting states one
  - says the postings do not state a salary figure
  must_refuse: false
- id: c09
  question: are there roles at quantitative trading or hedge fund firms?
  expected_facts:
  - names at least one trading or quantitative firm with a posting
  - names a role at that firm from the cited posting
  must_refuse: false
- id: c10
  question: which healthcare companies are hiring for data or AI roles?
  expected_facts:
  - names at least one company whose cited posting describes healthcare or clinical work
  - names a data or AI role at that company
  must_refuse: false
- id: c11
  question: which roles involve computer vision?
  expected_facts:
  - names at least one role whose cited posting mentions computer vision
  - does not list a posting that never mentions it
  must_refuse: false
- id: c12
  question: which companies say they offer visa sponsorship?
  expected_facts:
  - names only companies whose cited posting says they sponsor visas
  - does not list a company whose posting says sponsorship is not available
  must_refuse: false
- id: c13
  question: which data scientist roles are open in Pune?
  expected_facts:
  - names at least one data science posting located in Pune
  - gives the company for each role named
  must_refuse: false
- id: c14
  question: what does an analytics engineer do, according to these postings?
  expected_facts:
  - describes responsibilities drawn from cited analytics engineer postings
  - does not generalise beyond the postings shown
  must_refuse: false
- id: c15
  question: which roles ask for both Airflow and dbt?
  expected_facts:
  - names at least one role whose cited posting mentions both Airflow and dbt
  - does not list a posting that names only one of them
  must_refuse: false
- id: c16
  question: what is the capital of Peru?
  expected_facts:
  - says the postings do not contain this
  must_refuse: true
- id: c17
  question: which jobs are based in Brazil?
  expected_facts:
  - says no posting is located in Brazil
  must_refuse: true
- id: c18
  question: which roles ask for COBOL experience?
  expected_facts:
  - says no posting mentions COBOL
  must_refuse: true
- id: c19
  question: are there any Haskell developer roles?
  expected_facts:
  - says no posting mentions Haskell
  must_refuse: true
- id: c20
  question: which companies are hiring in Sri Lanka?
  expected_facts:
  - says no posting is located in Sri Lanka
  must_refuse: true
