# Golden QA pairs for /chat.
#
# Deliberately small. Every question is one local LLM call to answer plus one
# to judge, and on CPU that is around two minutes a question, so a suite of
# sixty would never be run and an eval nobody runs is not an eval.
#
# expected_facts are checked by the judge for completeness, not by string
# match. must_refuse marks the questions the corpus genuinely cannot answer:
# the correct behaviour is to say so, and a fluent answer to one of these is
# the single worst failure this system can have.
version: 1
questions:
- id: c01
  question: which companies are hiring Rust engineers?
  expected_facts:
  - names at least one company with a Rust role
  - does not claim to be a complete list of the market
  must_refuse: false
- id: c02
  question: what skills do the machine learning roles ask for most often?
  expected_facts:
  - names specific technologies rather than generic skills
  - the technologies named appear in the cited postings
  must_refuse: false
- id: c03
  question: are there any founding engineer roles, and where are they based?
  expected_facts:
  - names at least one founding engineer posting
  - gives a location for at least one of them
  must_refuse: false
- id: c04
  question: what is the capital of Peru?
  expected_facts:
  - says the postings do not contain this
  must_refuse: true
- id: c05
  question: which of these companies was founded by Elon Musk?
  expected_facts:
  - says the postings do not say who founded these companies
  must_refuse: true
- id: c06
  question: are there remote jobs that mention Kubernetes?
  expected_facts:
  - names at least one posting mentioning Kubernetes
  - states whether it is remote
  must_refuse: false
- id: c07
  question: what salary do the data engineer roles offer?
  expected_facts:
  - quotes a salary only if a cited posting states one
  - says that most postings do not state a salary
  must_refuse: false
- id: c08
  question: which posting pays the highest salary across the whole database?
  expected_facts:
  - says it can only speak to the postings retrieved, not the whole database
  # Corrected after the first run. This was must_refuse: true, which
  # contradicted its own expected_facts: the right behaviour is to answer and
  # scope the claim, not to decline. v2 of the prompt does exactly that
  # ("I can only see the salaries in [1], [3] and [5]") and the binary
  # refusal check scored it as a failure. The case was mis-specified, not the
  # answer.
  must_refuse: false
# Added 2026-09-26 to take the set from 8 to 20. Written against the corpus
# as it stood that day (468 postings); each answerable question was checked
# to have at least one posting that answers it, and each must_refuse one
# asks for something no posting states.
- id: c09
  question: which postings offer hourly contract rates, and what are the rates?
  expected_facts:
  - names at least one posting that quotes an hourly rate
  - every rate quoted appears in the cited posting
  must_refuse: false
- id: c10
  question: are there any internships or entry-level engineering roles?
  expected_facts:
  - names at least one intern or entry-level posting
  - does not claim there are none
  must_refuse: false
- id: c11
  question: which jobs are based in Germany, and in which cities?
  expected_facts:
  - names at least one posting located in Germany
  - gives the city stated in the posting
  must_refuse: false
- id: c12
  question: which companies say they offer visa sponsorship?
  expected_facts:
  - names only companies whose cited posting mentions sponsorship
  must_refuse: false
- id: c13
  question: what does a founding engineer role involve, according to these postings?
  expected_facts:
  - describes responsibilities drawn from cited founding engineer postings
  - does not generalise beyond the postings shown
  must_refuse: false
- id: c14
  question: which roles ask for Kubernetes experience?
  expected_facts:
  - names roles whose cited posting mentions Kubernetes
  - does not list a posting that never mentions it
  must_refuse: false
- id: c15
  question: are there healthcare or clinical software roles?
  expected_facts:
  - names at least one healthcare or clinical posting
  must_refuse: false
- id: c16
  question: of the postings you can see, which pays the most?
  expected_facts:
  - quotes a salary that appears in a cited posting
  - says the claim is limited to the retrieved postings
  must_refuse: false
- id: c17
  question: which roles involve building RAG systems or LLM agents?
  expected_facts:
  - names at least one posting that mentions RAG, agents or LLM applications
  - the technologies named appear in the cited postings
  must_refuse: false
- id: c18
  question: what are the visa requirements for working in Canada?
  expected_facts:
  - says the postings do not answer this
  must_refuse: true
- id: c19
  question: which of these companies are publicly traded?
  expected_facts:
  - says the postings do not state this
  must_refuse: true
- id: c20
  question: which programming language should I learn first to get hired?
  expected_facts:
  - declines to give career advice the postings do not contain
  must_refuse: true
