# Hand-adjudicated vocabulary for the Phase 6 test labels.
#
# The teacher returns skills the Phase 2 taxonomy has never heard of. Some are
# real technologies the dictionary is simply missing; some are prose the model
# lifted out of the posting because it ignored the instruction to skip job
# descriptions. A substring check cannot tell those apart, because both of
# them do appear in the text. So they were read and split by hand.
#
# `accepted` feeds back into Phase 2: these are the concrete gaps in
# SKILL_ALIASES, and adding them is the cheapest recall improvement available
# to the dictionary.
#
# `rejected` is the more interesting list. Almost all of it is the teacher
# answering a different question than it was asked: "production ai
# infrastructure" and "energy-aware scheduling and control" are what the job
# does, not tools you can put on a CV. A regex cannot make this mistake, and
# an 8B model makes it constantly.

