# Second review, 2026-09-19, after labelling grew the corpus from 242 to 464
# postings and produced 419 further off-taxonomy terms carrying 593 mentions.
# Same rule as the first pass: a named technology, language, framework,
# library, protocol or product is a skill; a description of the work is not.
#
# Three patterns worth recording, because they are the teacher's fingerprint.
#
# It mangles product names. "Claude Code" came back as claudia code, claud
# code, claudecode, claudes code, claudio, claudio code and cursor/claude
# code. Every variant is rejected and plain `claude` is accepted.
#
# It returns compliance standards as skills: hipaa, soc 2, iso 27001, pipeda,
# mfippa, ucc. A regulation is a context, not a tool, and the prompt already
# says to skip degrees and benefits for the same reason.
#
# It returns the shape of the job: high-scale backend services, real-time
# scoring pipelines, data-intensive applications, operational workflows,
# distributed systems development. These read like skills and cannot be
# separated from them by any rule that does not involve reading.


