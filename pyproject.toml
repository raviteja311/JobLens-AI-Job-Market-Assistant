[project]
name = "joblens"
version = "0.1.0"
description = "AI job market assistant"
requires-python = ">=3.12"
dependencies = [
    "httpx >= 0.27",
    "psycopg[binary] >= 3.2",
    "pydantic >= 2.7",
    "pydantic-settings >= 2.2",
    # Phase 2 onwards. Kept in the base install rather than an extra so that
    # `python -m joblens trends` works on a fresh clone without a second step.
    "pandas >= 2.2",
    "scikit-learn >= 1.5",
    "joblib >= 1.4",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "pre-commit",
]

[tool.ruff]
# Matches black's default so the two tools do not disagree.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
# Lets tests import from src/ without installing the project.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "db : needs a running Postgres. Skipped automatically when none is reachable",
    "slow : model training. Runs in CI, skip locally with -m 'not slow'",
]