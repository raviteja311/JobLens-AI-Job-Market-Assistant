[project]
name = "joblens"
version = "0.1.0"
description = "AI job market assistant"
requires-python = ">=3.12"
dependencies = [
    "httpx >= 0.27",
    "psycopg[binary] >= 3.2",
    "pydantic >= 2.7",
    "pydantic-settings >= 2.2"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "pre-commit",
]

[tool.ruff]
# Matches black's default so the two tools do not disagree.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
# Lets tests import from src/ without installing the project.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "db : needs a running Postgres. Skipped automatically when none is reachable"
]