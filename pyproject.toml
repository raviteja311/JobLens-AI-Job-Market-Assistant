[project]
name = "joblens"
version = "0.1.0"
description = "AI job market assistant"
requires-python = ">=3.12"
# Upper bounds stop at the next major version. Without them a fresh install
# or a CI run picks up whatever shipped that morning, and the first sign of a
# breaking release is a red build with no code change behind it.
dependencies = [
    "httpx >= 0.27, < 1",
    "psycopg[binary] >= 3.2, < 4",
    "pydantic >= 2.7, < 3",
    "pydantic-settings >= 2.2, < 3",
    # Phase 2 onwards. Kept in the base install rather than an extra so that
    # `python -m joblens trends` works on a fresh clone without a second step.
    "pandas >= 2.2, < 4",
    "scikit-learn >= 1.5, < 2",
    "joblib >= 1.4, < 2",
    # Phase 3 onwards.
    "sentence-transformers >= 3.0, < 7",
    "pyyaml >= 6.0, < 7",
    "fastapi >= 0.115, < 1",
    "uvicorn[standard] >= 0.30, < 1",
    "python-multipart >= 0.0.9, < 1",
    "pypdf >= 5.0, < 7",
    # 1.64: dynamic tabs, badges, required segmented controls, max_upload_size.
    "streamlit >= 1.64, < 2",
    # Phase 7. Request histograms and LLM cost counters on /metrics.
    "prometheus-client >= 0.20, < 1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "ruff",
    "black",
    "pre-commit",
]
# Phase 6 only: teacher labelling, LoRA training and the extractor benchmark
# (src/joblens/finetune/). Heavy, CPU torch is enough for the 0.5B student.
# Ranges are the major versions the committed adapters were trained with.
finetune = [
    "transformers >= 5.0, < 6",
    "peft >= 0.21, < 1",
    "trl >= 1.0, < 2",
    "datasets >= 5.0, < 6",
    "torch >= 2.4, < 3",
]

[tool.ruff]
# Matches black's default so the two tools do not disagree.
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.black]
line-length = 88
target-version = ["py312"]

[tool.pytest.ini_options]
# Lets tests import from src/ without installing the project.
pythonpath = ["src"]
testpaths = ["tests"]
markers = [
    "db : needs a running Postgres. Skipped automatically when none is reachable",
    "slow : model training. Runs in CI, skip locally with -m 'not slow'",
    "eval : scores retrieval or generation against the golden set",
    "llm : needs a reachable LLM backend. Skipped when none is configured",
]